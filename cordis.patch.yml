# dsh-thinking-language bundle patch.
#
# Registers the plugin's host entry (settings namespace + system-prompt
# section + the /thinking-language command). The browser half is discovered
# automatically by dsh-client-modules through the package's `dsh.client`
# declaration, so no client row is needed here.

- insert:
    - id: thinking-language
      name: dsh-thinking-language
